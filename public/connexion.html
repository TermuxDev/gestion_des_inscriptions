<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion Inscription</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--fond);
        }
        
        .login-container {
            background: var(--blanc);
            border-radius: 8px;
            box-shadow: var(--ombre-md);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            font-size: 1.8rem;
            color: var(--primaire);
            margin: 0 0 10px 0;
        }
        
        .login-header p {
            color: var(--texte-secondaire);
            font-size: 0.95rem;
            margin: 0;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-groupe {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-groupe label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--texte);
        }
        
        .form-groupe input {
            padding: 12px;
            border: 1px solid var(--bordure);
            border-radius: 4px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .form-groupe input:focus {
            outline: none;
            border-color: var(--primaire);
            box-shadow: 0 0 0 3px rgba(162, 28, 59, 0.1);
        }
        
        .role-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .role-selector-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--texte);
        }
        
        .role-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--bordure);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--fond);
        }
        
        .role-option input[type="radio"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--primaire);
        }
        
        .role-option:hover {
            border-color: var(--primaire);
            background: var(--fond-secondaire);
        }
        
        .role-option input[type="radio"]:checked + label {
            color: var(--primaire);
            font-weight: 600;
        }
        
        .role-option label {
            flex: 1;
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }
        
        .login-button {
            padding: 12px 16px;
            background: var(--primaire);
            color: var(--blanc);
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .login-button:hover {
            background: var(--primaire-hover);
            transform: translateY(-2px);
            box-shadow: var(--ombre-md);
        }
        
        .login-button:active {
            transform: translateY(0);
        }
        
        .helper-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--texte-secondaire);
            margin-top: 20px;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
            }
            
            .login-header h1 {
                font-size: 1.5rem;
            }
            
            .login-header p {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <p>Espace Connexion</p>
        </div>

        <form class="login-form" action="traitement/connexion_admin.php" method="POST">
            <!-- Email -->
            <div class="form-groupe">
                <label for="email">Adresse Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="exemple@domaine.com" 
                    required
                >
            </div>

            <!-- Mot de passe -->
            <div class="form-groupe">
                <label for="password">Mot de passe</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••" 
                    required
                >
            </div>

            <!-- Sélection du rôle -->
            <div class="role-selector">
                <span class="role-selector-label">Rôle *</span>
                
                <div class="role-option">
                    <input 
                        type="radio" 
                        id="admin" 
                        name="role" 
                        value="super_admin" 
                        required
                        checked
                    >
                    <label for="admin">Super Administrateur</label>
                </div>
                
                <div class="role-option">
                    <input 
                        type="radio" 
                        id="responsable" 
                        name="role" 
                        value="responsable_dept" 
                        required
                    >
                    <label for="responsable">Responsable Département</label>
                </div>
            </div>

            <!-- Bouton Connexion -->
            <button type="submit" class="login-button">Se connecter</button>
        </form>

    </div>
</body>
</html>
